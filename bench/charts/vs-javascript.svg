<svg xmlns="http://www.w3.org/2000/svg" width="820" height="482" viewBox="0 0 820 482" role="img" aria-label="ImageScript vs. the fastest other pure JavaScript library">
<title>ImageScript vs. the fastest other pure JavaScript library</title><style>
  .surface { fill: #fcfcfb } .text { fill: #0b0b0b } .muted { fill: #52514e } .grid { stroke: #e4e3df }
  .bar { fill: #8a8983 } .bar.highlight { fill: #2a78d6 }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19 } .text { fill: #f0efec } .muted { fill: #c3c2b7 } .grid { stroke: #383835 }
    .bar { fill: #6d6c66 } .bar.highlight { fill: #3987e5 }
  }
  .heat0 { fill: #1f9d55 } .heat1 { fill: #7cc46b } .heat2 { fill: #d9d36b } .heat3 { fill: #f0a35e } .heat4 { fill: #e2665a } .none { fill: #efeeea }
  .on-heat { fill: #0b0b0b } .ahead { fill: #2a78d6 } .behind { fill: #c4544a } .col-hl { fill: #2a78d6; fill-opacity: 0.08 }
  @media (prefers-color-scheme: dark) {
    .heat0 { fill: #23874c } .heat1 { fill: #5e9c52 } .heat2 { fill: #a49e4c } .heat3 { fill: #b77c45 } .heat4 { fill: #ad4d44 } .none { fill: #252524 }
    .on-heat { fill: #f7f6f2 } .ahead { fill: #3987e5 } .behind { fill: #d0675d } .col-hl { fill-opacity: 0.14 }
  }
  text { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif }
  .title { font-weight: 600; font-size: 14px } .bold { font-weight: 600 } .small { font-size: 11px }</style>
<rect class="surface" width="820" height="482" rx="8"/>
<text class="text title" x="20" y="28" style="font-size:16px">ImageScript vs. the fastest other pure JavaScript library</text>
<text class="muted" x="20" y="46">speed per task, against Jimp, image-js and PureJsImage (whichever is fastest at it)</text>
<line class="grid" x1="390" x2="390" y1="74" y2="446" stroke-width="1"/><text class="muted small" x="382" y="70" text-anchor="end">← slower</text><text class="muted small" x="398" y="70">faster →</text><text class="text" x="200" y="99" text-anchor="end">rotate by 30°</text><path class="ahead" d="M391,88h161a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-161z"/><text class="text bold" x="575" y="99">10.4× as fast as PureJsImage</text><text class="text" x="200" y="125" text-anchor="end">blur (radius 5)</text><path class="ahead" d="M391,114h158.92301284372934a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-158.92301284372934z"/><text class="text bold" x="575" y="125">10.1× as fast as image-js</text><text class="text" x="200" y="151" text-anchor="end">decode AVIF</text><path class="ahead" d="M391,140h138.0940533691577a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-138.0940533691577z"/><text class="text bold" x="575" y="151">7.51× as fast as PureJsImage</text><text class="text" x="200" y="177" text-anchor="end">crop</text><path class="ahead" d="M391,166h131.74022421809406a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-131.74022421809406z"/><text class="text bold" x="575" y="177">6.86× as fast as PureJsImage</text><text class="text" x="200" y="203" text-anchor="end">composite an overlay</text><path class="ahead" d="M391,192h97.79787748679415a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-97.79787748679415z"/><text class="text bold" x="575" y="203">4.24× as fast as image-js</text><text class="text" x="200" y="229" text-anchor="end">encode JPEG (quality 80)</text><path class="ahead" d="M391,218h44.623759803884866a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-44.623759803884866z"/><text class="text bold" x="575" y="229">1.99× as fast as image-js</text><text class="text" x="200" y="255" text-anchor="end">encode WebP (lossless)</text><path class="ahead" d="M391,244h41.54266262951954a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-41.54266262951954z"/><text class="text bold" x="575" y="255">1.91× as fast as PureJsImage</text><text class="text" x="200" y="281" text-anchor="end">decode JPEG</text><path class="ahead" d="M391,270h40.68284167697216a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-40.68284167697216z"/><text class="text bold" x="575" y="281">1.88× as fast as PureJsImage</text><text class="text" x="200" y="307" text-anchor="end">decode PNG</text><path class="ahead" d="M391,296h32.28125279906396a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-32.28125279906396z"/><text class="text bold" x="575" y="307">1.67× as fast as Jimp</text><text class="text" x="200" y="333" text-anchor="end">encode PNG</text><path class="ahead" d="M391,322h19.3019027511475a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-19.3019027511475z"/><text class="text bold" x="575" y="333">1.39× as fast as Jimp</text><text class="text" x="200" y="359" text-anchor="end">decode WebP (lossy)</text><path class="ahead" d="M391,348h11.114937240497563a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-11.114937240497563z"/><text class="text bold" x="575" y="359">1.24× as fast as PureJsImage</text><text class="text" x="200" y="385" text-anchor="end">clone</text><path class="ahead" d="M391,374h1.850122191930148a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-1.850122191930148z"/><text class="text bold" x="575" y="385">1.09× as fast as PureJsImage</text><text class="text" x="200" y="411" text-anchor="end">resize to half</text><rect class="ahead" x="391" y="400" width="2" height="14"/><text class="text bold" x="575" y="411">1.02× as fast as Jimp</text><text class="text" x="200" y="437" text-anchor="end">encode AVIF (quality 60)</text><rect class="behind" x="297.6725749314855" y="426" width="92.32742506851451" height="14" rx="3"/><text class="text" x="575" y="437">27% of PureJsImage</text><text class="muted small" x="20" y="462">encode AVIF: PureJsImage's encoder has no quality setting, its file is 992 kB at 32.7 dB (ImageScript: 93 kB at 40.9 dB)</text>
</svg>
