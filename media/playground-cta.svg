<svg xmlns="http://www.w3.org/2000/svg" width="440" height="72" viewBox="0 0 440 72" role="img" aria-labelledby="t d">
  <title id="t">Try ImageScript in the Playground</title>
  <desc id="d">Opens the ImageScript Playground: run ready-made examples on your own images, no setup needed</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="0.55" stop-color="#ff2d75"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="436" height="68" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="436" height="68" rx="18" fill="url(#shine)"/>
  <rect x="2.5" y="2.5" width="435" height="67" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
  <circle cx="44" cy="36" r="22" fill="#ffffff" fill-opacity="0.95"/>
  <path d="M38 25.5 L56 36 L38 46.5 Z" fill="#ff2d75"/>
  <text x="82" y="33" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Try it in the Playground</text>
  <text x="82" y="54" fill="#ffffff" fill-opacity="0.88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">Run ready-made examples on your own images</text>
  <path d="M400 28 L410 36 L400 44" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
